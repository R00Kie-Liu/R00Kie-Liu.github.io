<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-V3 的一个额外 MTP 模块</title><desc id="desc">上方为共享 embedding、61 层主干和 NTP 词表输出。主干 hidden 与真实的下一 token embedding 归一化并拼接，经新增融合投影及一个 causal Transformer 预测再下一个 token；词表投影与主模型共享。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#526174"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1000" height="520" fill="#ffffff"/><text x="30" y="42" font-size="28" text-anchor="start" fill="#172033">DeepSeek-V3: backbone + 1 MTP module</text><text x="30" y="76" font-size="18" text-anchor="start" fill="#536175">Training at anchor t: the gold token xₜ₊₁ is provided to the MTP branch.</text><rect x="30" y="110" width="230" height="82" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="145" y="145.5" font-size="20" text-anchor="middle" fill="#172033">Embedding E</text><text x="145" y="170.5" font-size="20" text-anchor="middle" fill="#172033">61-layer backbone</text><rect x="310" y="110" width="135" height="82" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="377.5" y="145.5" font-size="20" text-anchor="middle" fill="#172033">hₜ⁽⁰⁾</text><text x="377.5" y="170.5" font-size="20" text-anchor="middle" fill="#172033">d = 7168</text><rect x="520" y="110" width="185" height="82" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="612.5" y="145.5" font-size="20" text-anchor="middle" fill="#172033">LM head W</text><text x="612.5" y="170.5" font-size="20" text-anchor="middle" fill="#172033">shared weights</text><rect x="775" y="110" width="195" height="82" rx="12" fill="#f1f6f2" stroke="#45845a" stroke-width="2"/><text x="872.5" y="145.5" font-size="20" text-anchor="middle" fill="#172033">NTP label</text><text x="872.5" y="170.5" font-size="20" text-anchor="middle" fill="#172033">xₜ₊₁</text><path d="M 260 151 L 310 151" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 445 151 L 520 151" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 705 151 L 775 151" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="290" width="230" height="82" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="145" y="325.5" font-size="20" text-anchor="middle" fill="#172033">Gold token xₜ₊₁</text><text x="145" y="350.5" font-size="20" text-anchor="middle" fill="#172033">shared embedding E</text><rect x="310" y="290" width="135" height="82" rx="12" fill="#f3edff" stroke="#8654bd" stroke-width="2"/><text x="377.5" y="325.5" font-size="20" text-anchor="middle" fill="#172033">2 × Norm</text><text x="377.5" y="350.5" font-size="20" text-anchor="middle" fill="#172033">concat: 2d</text><rect x="520" y="270" width="185" height="122" rx="12" fill="#f3edff" stroke="#8654bd" stroke-width="2"/><text x="612.5" y="313" font-size="18" text-anchor="middle" fill="#172033">Linear M₁: 2d → d</text><text x="612.5" y="338" font-size="18" text-anchor="middle" fill="#172033">Transformer T₁</text><text x="612.5" y="363" font-size="18" text-anchor="middle" fill="#172033">hₜ⁽¹⁾: d</text><rect x="775" y="290" width="195" height="82" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="872.5" y="325.5" font-size="20" text-anchor="middle" fill="#172033">LM head W</text><text x="872.5" y="350.5" font-size="20" text-anchor="middle" fill="#172033">shared weights</text><rect x="775" y="420" width="195" height="60" rx="12" fill="#f1f6f2" stroke="#45845a" stroke-width="2"/><text x="872.5" y="457" font-size="20" text-anchor="middle" fill="#172033">MTP label xₜ₊₂</text><path d="M 377.5 192 L 377.5 290" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><text x="394" y="246" font-size="17" text-anchor="start" fill="#536175">hidden</text><path d="M 260 331 L 310 331" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 445 331 L 520 331" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 705 331 L 775 331" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 872.5 372 L 872.5 420" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><text x="30" y="440" font-size="18" text-anchor="start" fill="#536175">Inference: replace the gold token with the selected token a.</text><text x="30" y="473" font-size="18" text-anchor="start" fill="#536175">T₁ attends causally over the aligned sequence.</text></svg>
