<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">GLM-5 的三次共享 MTP 训练展开</title><desc id="desc">同一个辅助模块依次接收主干 hidden 或上一步辅助 hidden，并在三个深度分别补入真实的下一 token embedding，预测更后一个位置。三个紫色方框共享一份参数，调用之间存在串行 hidden 依赖。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#526174"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1000" height="550" fill="#ffffff"/><text x="30" y="42" font-size="28" text-anchor="start" fill="#172033">GLM-5: one shared MTP module, three training calls</text><text x="30" y="76" font-size="18" text-anchor="start" fill="#536175">Calls are serial; each depth receives a shifted gold token.</text><rect x="25" y="230" width="110" height="74" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="80" y="261.5" font-size="20" text-anchor="middle" fill="#172033">backbone</text><text x="80" y="286.5" font-size="20" text-anchor="middle" fill="#172033">hₜ⁽⁰⁾</text><rect x="190" y="110" width="210" height="56" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="295" y="145" font-size="20" text-anchor="middle" fill="#172033">E(xₜ₊₁)</text><rect x="190" y="230" width="210" height="74" rx="12" fill="#f3edff" stroke="#8654bd" stroke-width="2"/><text x="295" y="261.5" font-size="20" text-anchor="middle" fill="#172033">same F_aux</text><text x="295" y="286.5" font-size="20" text-anchor="middle" fill="#172033">call 1 (k = 1)</text><rect x="190" y="365" width="210" height="60" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="295" y="402" font-size="20" text-anchor="middle" fill="#172033">same LM head W</text><path d="M 295 166 L 295 230" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 295 304 L 295 365" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 295 425 L 295 451" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><text x="295" y="480" font-size="22" text-anchor="middle" fill="#172033">label xₜ₊₂</text><rect x="475" y="110" width="210" height="56" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="580" y="145" font-size="20" text-anchor="middle" fill="#172033">E(xₜ₊₂)</text><rect x="475" y="230" width="210" height="74" rx="12" fill="#f3edff" stroke="#8654bd" stroke-width="2"/><text x="580" y="261.5" font-size="20" text-anchor="middle" fill="#172033">same F_aux</text><text x="580" y="286.5" font-size="20" text-anchor="middle" fill="#172033">call 2 (k = 2)</text><rect x="475" y="365" width="210" height="60" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="580" y="402" font-size="20" text-anchor="middle" fill="#172033">same LM head W</text><path d="M 580 166 L 580 230" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 580 304 L 580 365" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 580 425 L 580 451" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><text x="580" y="480" font-size="22" text-anchor="middle" fill="#172033">label xₜ₊₃</text><rect x="760" y="110" width="210" height="56" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="865" y="145" font-size="20" text-anchor="middle" fill="#172033">E(xₜ₊₃)</text><rect x="760" y="230" width="210" height="74" rx="12" fill="#f3edff" stroke="#8654bd" stroke-width="2"/><text x="865" y="261.5" font-size="20" text-anchor="middle" fill="#172033">same F_aux</text><text x="865" y="286.5" font-size="20" text-anchor="middle" fill="#172033">call 3 (k = 3)</text><rect x="760" y="365" width="210" height="60" rx="12" fill="#eaf3ff" stroke="#3274ad" stroke-width="2"/><text x="865" y="402" font-size="20" text-anchor="middle" fill="#172033">same LM head W</text><path d="M 865 166 L 865 230" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 865 304 L 865 365" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 865 425 L 865 451" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><text x="865" y="480" font-size="22" text-anchor="middle" fill="#172033">label xₜ₊₄</text><path d="M 135 267 L 190 267" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 400 267 L 475 267" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 685 267 L 760 267" fill="none" stroke="#526174" stroke-width="2.4" marker-end="url(#arrow)"/><text x="437.5" y="246" font-size="19" text-anchor="middle" fill="#172033">hₜ⁽¹⁾</text><text x="722.5" y="246" font-size="19" text-anchor="middle" fill="#172033">hₜ⁽²⁾</text><text x="30" y="520" font-size="18" text-anchor="start" fill="#536175">NTP branch omitted. Shared weights do not imply parallel calls or shared KV states.</text></svg>
